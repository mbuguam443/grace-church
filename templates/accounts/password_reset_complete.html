{% extends 'admin/base.html' %}
{% load static %}

{% block title %}Password Reset Complete &mdash; {{ church_settings.church_name|default:"Church Admin" }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0"><i class="bi bi-check-circle me-2"></i>Password Reset Complete</h5>
            </div>
            <div class="card-body text-center">
                <div class="mb-3">
                    <i class="bi bi-check-circle" style="font-size: 3rem; color: #198754;"></i>
                </div>
                <p class="mb-3">Your password has been successfully reset.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login with New Password
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
